name: enhanced_flutter_speech_to_text
description: An enhanced Flutter package for speech-to-text conversion with provider-based state management.
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ^3.0.0
  flutter: ^3.0.0

dependencies:
  flutter:
    sdk: flutter

  # Speech Recognition
  speech_to_text: ^7.3.0

  # Text-to-Speech
  flutter_tts: ^4.0.0

  # Audio Playback
  audioplayers: ^5.0.0

  # State Management
  provider: ^6.0.0

  # Preferences
  shared_preferences: ^2.0.0

  # Internationalization
  intl: ^0.19.0

  # Fonts
  google_fonts: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

